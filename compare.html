<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST-DCT Codec Comparison</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 800px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .comparison { display: flex; flex-direction: column; gap: 20px; margin-top: 30px; }
        .item { border: 1px solid #ddd; padding: 15px; border-radius: 5px; }
        h3 { margin-top: 0; }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ST-DCT Audio Codec Comparison</h1>
        
        <div class="comparison">
            <div class="item">
                <h3>Original Audio (input.wav)</h3>
                <audio controls src="input.wav"></audio>
            </div>
            
            <div class="item">
                <h3>Reconstructed Audio (input_recon.wav)</h3>
                <p>Decoded from <code>input.avif</code> (Quality=80)</p>
                <audio controls src="input_recon.wav"></audio>
            </div>
        </div>
    </div>
</body>
</html>
