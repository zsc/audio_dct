<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST-DCT 编解码演示 - 不同压缩质量对比</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 40px; background: #f8f9fa; line-height: 1.6; }
        .container { background: white; padding: 30px; border-radius: 12px; max-width: 700px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #eee; border-radius: 8px; }
        h3 { margin-top: 0; color: #34495e; }
        audio { width: 100%; margin-top: 15px; }
        .controls { display: flex; align-items: center; gap: 15px; margin-top: 10px; }
        select { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; background: white; cursor: pointer; flex-grow: 1; }
        .info { font-size: 14px; color: #666; margin-top: 10px; }
        code { background: #f0f0f0; padding: 2px 5px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ST-DCT 音频编解码演示</h1>
        
        <div class="section">
            <h3>原始音频 (Original)</h3>
            <code>input.wav</code>
            <audio controls src="input.wav"></audio>
        </div>
        
        <div class="section">
            <h3>重建音频 (Reconstructed)</h3>
            <div class="controls">
                <label for="quality-select">选择 AVIF 压缩质量 (Q):</label>
                <select id="quality-select">
                    <option value="70">Q = 70 (高压缩)</option>
                    <option value="85" selected>Q = 85 (均衡)</option>
                    <option value="90">Q = 90 (高保真)</option>
                    <option value="95">Q = 95 (极高保真)</option>
                </select>
            </div>
            
            <audio id="recon-player" controls src="input_q85_recon.wav"></audio>
            
            <div class="info">
                当前音频: <span id="current-file">input_q85_recon.wav</span>
            </div>
            
            <div style="margin-top: 20px;">
                <h4>对应 AVIF 频谱图:</h4>
                <div class="info" style="margin-bottom: 5px;">
                    图像文件: <span id="current-image">input_q85.avif</span>
                </div>
                <!-- Adding a border and max-height for better display -->
                <img id="spectrogram-view" src="input_q85.avif" alt="AVIF Spectrogram" style="width: 100%; height: auto; border: 1px solid #ccc; max-height: 300px; object-fit: cover;">
                <p class="info">注意：某些旧版浏览器可能无法直接显示 AVIF 图片。</p>
            </div>
        </div>

        <div class="info" style="text-align: center;">
            基于 ST-DCT 变换映射为灰度图像，通过 AVIF 格式存储。振幅信息存储于 EXIF 中以还原响度。
        </div>
    </div>

    <script>
        const select = document.getElementById('quality-select');
        const player = document.getElementById('recon-player');
        const fileLabel = document.getElementById('current-file');
        const imgView = document.getElementById('spectrogram-view');
        const imgLabel = document.getElementById('current-image');

        select.addEventListener('change', (e) => {
            const q = e.target.value;
            const audioFile = `input_q${q}_recon.wav`;
            const imageFile = `input_q${q}.avif`;
            
            player.src = audioFile;
            fileLabel.textContent = audioFile;
            
            imgView.src = imageFile;
            imgLabel.textContent = imageFile;
            
            player.play();
        });
    </script>
</body>
</html>
